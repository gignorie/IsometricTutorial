name: Android CI - Build APK
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-android:
    name: Build Android (assembleDebug)
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for Android SDK tools and Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command line tools
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo /tmp/commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q /tmp/commandlinetools.zip -d "$ANDROID_HOME/cmdline-tools"
          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi

          # Persist SDK tool paths for subsequent steps
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

          # Install platforms/build-tools likely needed by modern projects (keep older one for compatibility)
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-27" "build-tools;27.0.3" "platforms;android-31" "build-tools;31.0.0" "platforms;android-33" "build-tools;33.0.0"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Print Java and SDK info
        run: |
          java -version || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"

      - name: Build Android (copy natives + assembleDebug)
        run: |
          ./gradlew --no-daemon :android:copyAndroidNatives :android:assembleDebug --stacktrace --info

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android/build/outputs/apk/**/app-*-debug.apk
            android/build/outputs/apk/**/*.apk

      - name: Clear Gradle cache
        run: rm -rf ~/.gradle/caches ~/.gradle/wrapper
